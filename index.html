<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tank Artillery Web</title>
    <!-- PWA：圖示與 iOS 啟動畫面由 tools/assets/paint_pwa.mjs 產生（只有橫向，遊戲固定橫著玩） -->
    <meta name="theme-color" content="#4cb2ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="空域砲決" />
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="./icons/splash-1334x750.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="./icons/splash-2532x1170.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="./icons/splash-2556x1179.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="./icons/splash-2796x1290.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="./icons/splash-2388x1668.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <link rel="apple-touch-startup-image" href="./icons/splash-2732x2048.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
    <style>
      /* 開啟畫面：Vue 掛載前就顯示，main.ts 掛載完成後淡出移除。素材來自 public/assets/ui2/（tools/assets/agy-ui/slice_ui.py） */
      #boot-splash {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4vh; overflow: hidden;
        background: linear-gradient(#4cb2ff, #bfe4ff); color: #1d2340; font-family: 'Baloo 2', 'Huninn', system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      #boot-splash .bs-cloud { position: absolute; height: auto; opacity: 0.95; animation: boot-drift linear infinite; }
      #boot-splash .bs-cloud.a { width: 24vh; top: 12%; left: -30vh; animation-duration: 36s; }
      #boot-splash .bs-cloud.b { width: 15vh; top: 62%; left: -20vh; animation-duration: 52s; animation-delay: -20s; }
      #boot-splash .bs-logo { position: relative; width: min(64vh, 70vw); height: auto; filter: drop-shadow(0 0.8vh 0 rgb(29 35 64 / 0.35)); animation: boot-bob 1.4s ease-in-out infinite alternate; }
      /* 進度條：外框是 hp_bar 素材，內部金色條來回滑動 */
      #boot-splash .bs-bar { position: relative; width: min(46vh, 60vw); aspect-ratio: 512 / 106; background: url(./assets/ui2/gauges/hp_bar.png) center / 100% 100% no-repeat; }
      #boot-splash .bs-bar::after {
        content: ''; position: absolute; left: 14%; right: 3.5%; top: 30%; bottom: 30%; border-radius: 999px;
        background: linear-gradient(90deg, transparent 0 var(--p, 0%), #ffc93d var(--p, 0%) calc(var(--p, 0%) + 35%), transparent calc(var(--p, 0%) + 35%));
        animation: boot-load 1.1s ease-in-out infinite alternate;
      }
      #boot-splash small { font-size: min(3.2vh, 4vw); color: #1d2340; opacity: 0.7; letter-spacing: 0.1em; }
      #boot-splash.is-done { opacity: 0; pointer-events: none; }
      @property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
      @keyframes boot-bob { from { transform: translateY(0) rotate(-1deg); } to { transform: translateY(-1.5vh) rotate(1deg); } }
      @keyframes boot-load { from { --p: 0%; } to { --p: 65%; } }
      @keyframes boot-drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 60vh)); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash .bs-cloud, #boot-splash .bs-logo, #boot-splash .bs-bar::after { animation: none; } }
      /* 手機直拿：遊戲只支援橫向，蓋上「請轉橫」提示 */
      #rotate-hint {
        position: fixed; inset: 0; z-index: 200; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem;
        background: linear-gradient(#4cb2ff, #bfe4ff); color: #1d2340; font-family: 'Huninn', system-ui, sans-serif; font-size: 1.25rem; text-align: center; padding: 2rem;
      }
      #rotate-hint svg { width: 7rem; height: 7rem; animation: rotate-phone 1.6s ease-in-out infinite; }
      @keyframes rotate-phone { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) and (max-width: 900px) {
        #rotate-hint { display: flex; }
      }
    </style>
    <!-- 大廳字型：jf open 粉圓 (Huninn) + Baloo 2，皆為 SIL OFL -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Huninn&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-gradient-to-b from-slate-950 via-sky-950 to-slate-900 text-slate-100 antialiased selection:bg-amber-400 selection:text-slate-950">
    <div id="boot-splash" aria-hidden="true">
      <img class="bs-cloud a" src="./assets/ui2/title/cloud_big.png" alt="" />
      <img class="bs-cloud b" src="./assets/ui2/title/cloud_small.png" alt="" />
      <img class="bs-logo" src="./assets/ui2/title/logo.png" alt="" />
      <div class="bs-bar"></div>
      <small>載入中…</small>
    </div>
    <div id="rotate-hint" role="alert">
      <svg viewBox="0 0 64 64" fill="none" stroke="#1d2340" stroke-width="4" stroke-linejoin="round">
        <rect x="18" y="6" width="28" height="52" rx="6" fill="#fff" />
        <circle cx="32" cy="50" r="2.5" fill="#1d2340" stroke="none" />
      </svg>
      <div>請把手機轉成橫向<br /><small style="color:#4a5378">空域砲決只支援橫著玩</small></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
